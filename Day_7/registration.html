<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link rel="stylesheet" href="registration.css">
</head>
<body>

  <main>
    <form action="#" method="post">
      <h1>Student Registration</h1>

      <fieldset>
        <legend>Personal Details</legend>

        <div class="form-row">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10 digits">
          </div>
          <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" name="dob">
          </div>
        </div>

        <p class="group-title">Gender</p>
        <div class="options">
          <label><input type="radio" name="gender" value="male"> Male</label>
          <label><input type="radio" name="gender" value="female"> Female</label>
          <label><input type="radio" name="gender" value="other"> Other</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Academic Details</legend>

        <div class="form-row">
          <div class="form-group">
            <label for="course">Course</label>
            <select id="course" name="course">
              <option value="">-- Select --</option>
              <option>Computer Science</option>
              <option>Information Technology</option>
              <option>Electronics</option>
            </select>
          </div>
          <div class="form-group">
            <label for="year">Year</label>
            <select id="year" name="year">
              <option value="">-- Select --</option>
              <option>First Year</option>
              <option>Second Year</option>
              <option>Third Year</option>
              <option>Final Year</option>
            </select>
          </div>
        </div>

        <p class="group-title">Interests</p>
        <div class="options">
          <label><input type="checkbox" name="interests" value="web"> Web Development</label>
          <label><input type="checkbox" name="interests" value="ai"> AI/ML</label>
          <label><input type="checkbox" name="interests" value="data"> Data Analytics</label>
        </div>

        <div class="form-group">
          <label for="address">Address</label>
          <textarea id="address" name="address" rows="4"></textarea>
        </div>
      </fieldset>

      <div class="buttons">
        <button type="submit">Register</button>
        <button type="reset" class="secondary">Reset</button>
      </div>
    </form>
  </main>

</body>
</html>
